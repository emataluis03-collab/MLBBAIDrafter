name: Build MLBB AI Drafter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project (folder containing settings.gradle.kts)
        run: |
          echo "Repository files:"
          find . -path ./.git -prune -o -type f -print | head -50
          SETTINGS="$(find . -path ./.git -prune -o -name settings.gradle.kts -print | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found. Upload the CONTENTS of the ZIP (not the ZIP file itself)."
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"
          if [ ! -f "$DIR/app/build.gradle.kts" ]; then
            echo "::error::$DIR/app/build.gradle.kts is missing. The app folder was not uploaded."
            exit 1
          fi
          if [ ! -f "$DIR/build.gradle.kts" ]; then
            echo "::error::$DIR/build.gradle.kts (ROOT build file) is missing. It declares the Android plugin versions and must sit next to settings.gradle.kts."
            exit 1
          fi
          echo "===== settings.gradle.kts ====="
          cat "$DIR/settings.gradle.kts"
          echo "===== build.gradle.kts (root) ====="
          cat "$DIR/build.gradle.kts"
          echo "===== app/build.gradle.kts ====="
          cat "$DIR/app/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install required packages
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM="$(command -v sdkmanager)"; fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper (jar + scripts) if missing
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Show Gradle projects
        run: cd "$PROJECT_DIR" && ./gradlew projects

      - name: Build debug APK
        run: cd "$PROJECT_DIR" && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-AI-Drafter-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
